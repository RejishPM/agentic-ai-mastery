[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldops-workshop"
version = "0.1.0"
description = "Simulated FieldOps workflow with LangGraph and Amazon Bedrock"
requires-python = ">=3.11"
dependencies = ["boto3[crt]>=1.42,<2", "langgraph>=1.0,<2"]

[project.scripts]
fieldops = "fieldops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
